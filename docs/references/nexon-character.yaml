openapi: 3.0.3
info:
  title: 메이플스토리 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 메이플스토리 게임 데이터는 평균 15분 후 확인 가능합니다.
    - 과거 데이터는 원하는 일자를 입력해 조회할 수 있으며, 전일 데이터는 다음날 오전 2시부터 확인할 수 있습니다. (12월 22일 데이터 조회 시, 22일 00시부터 23일 00시 사이 데이터가 조회 됩니다.)
    - 게임 콘텐츠 변경으로 ocid가 변경될 수 있습니다. ocid 기반 서비스 갱신 시 유의해 주시길 바랍니다.
    - 해당 API는 메이플스토리 한국의 데이터가 제공됩니다.
servers:
  - url: 'https://open.api.nexon.com'
tags:
  - name: User
    description: 계정 정보 조회  
  - name: Character
    description: 캐릭터 정보 조회

paths:
  /maplestory/v1/character/list:
    get:
      tags:
        - User
      summary: 캐릭터 목록 조회
      description: 계정의 보유 캐릭터 목록을 조회합니다.
      parameters:
        - name: x-nxopen-api-key
          in: header
          description: API KEY
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
