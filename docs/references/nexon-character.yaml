components:
  schemas:
    CharacterList:
      type: object
      properties:
        account_list:
          type: array
          description: 메이플스토리 계정 목록
          items:
            type: object
            properties:
              account_id:
                type: string
                description: 메이플스토리 계정 식별자
              character_list:
                type: array
                description: 캐릭터 목록
                items:
                  type: object
                  properties:
                    ocid:
                      type: string
                      description: 캐릭터 식별자
                    character_name: 
                      type: string
                      description: 캐릭터 명
                    world_name:
                      type: string
                      description: 월드 명
                    character_class:
                      type: string
                      description: 캐릭터 직업
                    character_level:
                      type: number
                      format: int64
                      description: 캐릭터 레벨
    Achievement:
      type: object
      properties:
        account_list:
          type: array
          description: 메이플스토리 계정 목록
          items:
            type: object
            properties:
              account_id:
                type: string
                description: 메이플스토리 계정 식별자
              achievement_achieve:
                type: array
                description: 달성 업적 정보
                items:
                  type: object
                  properties:
                    achievement_name:
                      type: string
                      description: 업적 명
                    achievement_description:
                      type: string
                      description: 업적 설명
    Character:
      type: object
      properties:
        ocid:
          type: string
          description: 캐릭터 식별자
    CharacterBasic:
      type: object
      properties:
        date:
          type: string
          description: 조회 기준일 (KST, 일 단위 데이터로 시, 분은 일괄 0으로 표기)
          example: "2023-12-21T00:00+09:00"
        character_name: 
          type: string
          description: 캐릭터 명
        world_name:
          type: string
          description: 월드 명
        character_gender:
          type: string
          description: 캐릭터 성별
        character_class:
          type: string
          description: 캐릭터 직업
        character_class_level:
          type: string
          description: 캐릭터 전직 차수
        character_level:
          type: number
          format: int64
          description: 캐릭터 레벨
        character_exp:
          type: number
          format: int64
          description: 현재 레벨에서 보유한 경험치
        character_exp_rate:
          type: string
          description: 현재 레벨에서 경험치 퍼센트
        character_guild_name:
          type: string
          description: 캐릭터 소속 길드 명
        character_image:
          type: string
          description: |
            캐릭터 외형 이미지
            - ※ 이벤트 캐릭터인 사이타마의 경우 기본 모션만 제공되며, 쿼리 파라미터를 통한 모습 변경이 불가합니다.
            - 이펙트형 장비를 장착한 경우, 이펙트를 제외한 외형만 아바타 이미지에 적용됩니다.
            - 조회된 캐릭터 외형 이미지 URL에 쿼리 파리미터를 사용하여 캐릭터 이미지의 동작이나 감정표현을 변경하실 수 있습니다.
            - 쿼리 파라미터는 API로 조회된 URL 뒤에 물음표(?)와 "Key=value" 쌍을 입력하여 조회합니다.
            - 여러 개의 쿼리 파라미터를 전달하려면 파라미터 사이에 앰퍼샌드(&)을 추가하여 하나의 문자열로 입력합니다.
            - 액션 및 감정표현에 프레임 값("Key=value.number")을 입력하여 아바타 이미지를 프레임 별로 조회 가능합니다. (20250116 추가)
            - 게임에 설정된 무기 모션이 반영된 이미지로 조회되며, 무기 모션 파라미터로 변경하며 사용할 수 있습니다. (20251120 추가)
            - 예시: https://open.api.nexon.com/static/maplestory/character/look/ABCDEFG**?action=A00.2&emotion=E00**
            - 캐릭터 외형 이미지에 사용할 수 있는 쿼리 파라미터는 다음과 같습니다. 
              - action: 액션 (A00 ~ A41)
                - A00: stand1 (default)<br> - frame: 0 ~ 2
