name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        shell: pwsh
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$taskVersion") { throw 'Tag must match package.json version' }
          if ($taskVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable releases are supported' }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $taskInstaller = "release/Maple-Roster-Setup-$taskVersion-x64.exe"
          gh release create $env:GITHUB_REF_NAME $taskInstaller "$taskInstaller.blockmap" release/latest.yml --draft --verify-tag --title "Maple Roster v$taskVersion" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
