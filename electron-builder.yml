appId: com.mapleroster.desktop
productName: Maple Roster
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
publish:
  provider: github
  owner: winter3671
  repo: maple-roster
  releaseType: release
win:
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Maple-Roster-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Maple Roster
  deleteAppDataOnUninstall: false
  runAfterFinish: false
